name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS Application (Release, Unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -R app/build/ios/iphoneos/Runner.app Payload/
          zip -r -y ReGive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReGive-IPA
          path: ReGive.ipa
          retention-days: 7
